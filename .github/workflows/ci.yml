name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint & Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,studio]

      - name: Run Pytest
        run: |
          pytest -v

      - name: Run Benchmark Gate
        # §4: a benchmark run with no --baseline just prints scores — it never
        # exits non-zero, so it gated nothing. Compare against the committed
        # SSOT baseline instead; the candidate report is kept as an artifact
        # so a failure can be inspected without re-running the benchmark.
        run: |
          python -m studio.benchmark \
            --out .artifacts/benchmark-current.json \
            --baseline studio/data/benchmark/baseline.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-py${{ matrix.python-version }}
          path: .artifacts/benchmark-current.json
          if-no-files-found: ignore
